<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#261439">
  <meta name="description" content="Wähle Google Maps oder Apple Karten und navigiere direkt zum Happy Eck Kiosk in Hamm.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Anfahrt · Happy Eck Kiosk">
  <meta property="og:description" content="Google Maps oder Apple Karten wählen und direkt zu uns navigieren.">
  <meta property="og:url" content="https://happyeck.de/anfahrt/">
  <title>Anfahrt | Happy Eck Kiosk</title>
  <link rel="icon" type="image/jpeg" href="../assets/logo.jpg">
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:22px;
      background:radial-gradient(circle at 20% 5%, #453164 0, transparent 45%),linear-gradient(145deg,#171b38,#0f2526);
      color:#fff; }
    main { width:min(100%,540px); overflow:hidden; border:1px solid #77568f; border-radius:25px;
      background:linear-gradient(145deg,#2c1748,#1b1c44); box-shadow:0 18px 70px #0905178c; }
    header { padding:30px 30px 22px; background:#2b1647; }
    .eyebrow { margin:0 0 16px; color:#69e3ee; font-size:12px; font-weight:800; letter-spacing:.2em; }
    h1 { font:normal clamp(29px,6vw,41px)/1.08 Georgia,"Times New Roman",serif; letter-spacing:-.025em; margin:0 0 18px; }
    .address { margin:0; color:#d8c9e0; line-height:1.55; font-size:15px; }
    .choices { padding:22px 24px 12px; display:grid; gap:13px; }
    .choice { display:flex; align-items:center; gap:16px; min-height:94px; text-decoration:none; color:#fff;
      padding:17px; border-radius:20px; border:1px solid #765584; background:#ffffff0d; }
    .choice:hover,.choice:focus-visible { background:#ffffff1d; border-color:#ba9bd2; outline-offset:4px; }
    .logo { display:grid; place-items:center; flex:none; width:62px; height:62px; border-radius:17px; background:#fff; }
    .logo img { width:42px; height:42px; object-fit:contain; }
    .copy { display:grid; flex:1; gap:5px; min-width:0; }
    strong { font-size:22px; }
    small { font-size:14px; color:#d5c9dd; line-height:1.4; }
    .arrow { font-size:27px; font-weight:500; }
    footer { margin:0; padding:10px 27px 26px; color:#d5c9dd; font-size:13px; line-height:1.55; }
    @media(max-width:440px) { header {padding:25px 22px 20px;} .choices {padding:20px 18px 10px;}
      .choice {min-height:84px;padding:13px;gap:12px;} .logo {width:52px;height:52px;} .logo img {width:35px;height:35px;}
      strong {font-size:19px;} small {font-size:12px;} footer {padding:8px 20px 22px;} }
    @media(prefers-reduced-motion:no-preference) { .choice {transition:background .15s,border-color .15s;} }
  </style>
<link rel="stylesheet" href="../assets/winter-nights-2026.css?v=1">
</head>
<body class="happy-site">
  <main>
    <header>
      <p class="eyebrow">HAPPY ECK · ANFAHRT</p>
      <h1>Wählen Sie Ihre Karten-App</h1>
      <p class="address">Happy Eck Kiosk · Caldenhofer Weg 207 · 59063 Hamm</p>
    </header>
    <nav class="choices" aria-label="Karten-App auswählen">
      <a class="choice" href="https://www.google.com/maps/dir/?api=1&amp;destination=Caldenhofer+Weg+207%2C+59063+Hamm">
        <span class="logo"><img src="../assets/google-maps.svg" alt=""></span>
        <span class="copy"><strong>Google Maps</strong><small>Route mit Google Maps öffnen</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="choice" href="https://maps.apple.com/?daddr=Caldenhofer+Weg+207%2C+59063+Hamm">
        <span class="logo"><img src="../assets/apple-maps.svg" alt=""></span>
        <span class="copy"><strong>Apple Karten</strong><small>Route mit Apple Karten öffnen</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer>Wähle deine Karten-App. Die Navigation öffnet sich direkt im Browser oder in der entsprechenden App.</footer>
  </main>
</body>
</html>
