name: Website quality
on:
  push:
    branches:
      - design/premium-happy-eck-2026
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website
        run: node scripts/validate-site.mjs
