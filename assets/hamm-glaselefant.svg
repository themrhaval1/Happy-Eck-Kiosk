<svg xmlns="http://www.w3.org/2000/svg" width="288" height="240" viewBox="0 0 288 240" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Glaselefant Hamm</title>
<desc id="desc">Eine eigene stilisierte Illustration des gläsernen Elefanten im Maximilianpark Hamm, mit leuchtenden Fenstern, Rüssel und Stoßzähnen.</desc>
<defs>
 <linearGradient id="frame" x1="32" y1="35" x2="234" y2="206" gradientUnits="userSpaceOnUse"><stop stop-color="#9EECFF"/><stop offset=".55" stop-color="#A59BFF"/><stop offset="1" stop-color="#FF98D8"/></linearGradient>
 <linearGradient id="glass" x1="40" y1="64" x2="224" y2="174" gradientUnits="userSpaceOnUse"><stop stop-color="#76E7F3" stop-opacity=".27"/><stop offset="1" stop-color="#B78AFF" stop-opacity=".13"/></linearGradient>
 <linearGradient id="trunk" x1="196" y1="137" x2="194" y2="206" gradientUnits="userSpaceOnUse"><stop stop-color="#E5F8FF"/><stop offset="1" stop-color="#89F2FA"/></linearGradient>
 <clipPath id="body"><path d="M34 74 126 54 164 68V153l-130 21z"/></clipPath>
 <clipPath id="head"><path d="M139 48h63c15 0 24 10 24 24v56c0 13-12 24-24 24h-63z"/></clipPath>
</defs>
