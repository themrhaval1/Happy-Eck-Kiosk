<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f2ff">
<meta name="robots" content="noindex,nofollow">
<title>Für Lea 💌</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#302548;background:#f8f2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#ffe0e9,transparent 42%),radial-gradient(circle at 85% 80%,#e5d7ff,transparent 45%),#f8f2ff}
.card{width:min(100%,390px);padding:39px 29px 35px;border:1px solid #eee4f5;border-radius:29px;background:#fff;box-shadow:0 20px 65px #5d3c8217;text-align:center}
.emoji{font-size:51px;display:block;margin-bottom:16px}
h1{font-size:clamp(35px,10vw,46px);letter-spacing:-.065em;line-height:1.12;margin:0 0 15px}
p{font-size:17px;color:#6d627c;line-height:1.6;margin:0 0 24px}
button{appearance:none;width:100%;min-height:55px;background:#8462dc;color:white;border:0;border-radius:16px;font:inherit;font-weight:850;font-size:17px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid #50348c;outline-offset:4px}
small{display:block;color:#aba1b4;margin-top:17px;font-size:12px}
[hidden]{display:none!important}
#surprise{animation:appear .35s ease both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#surprise{animation:none}}
</style>
</head>
<body>
<main class="card">
<section id="welcome">
<span class="emoji" aria-hidden="true">💌</span>
<h1>Lea, ganz kurz …</h1>
<p>Ich hab eine wichtige Nachricht für dich. 😂</p>
<button type="button" id="open">Öffnen 👀</button>
<small>Keine Sorge, dauert nur 5 Sekunden.</small>
</section>
<section id="surprise" hidden aria-live="polite">
<span class="emoji" aria-hidden="true">😂❤️</span>
<h1>Lea is The Mentalist 🕵️‍♀️</h1>
<p>Andere schreiben einfach „Ich vermisse dich“.<br>Ich bau dir direkt eine Website. 💀</p>
<button type="button" id="again">Nochmal ansehen 😂</button>
</section>
</main>
<script>
const welcome=document.getElementById("welcome");
const surprise=document.getElementById("surprise");
document.getElementById("open").addEventListener("click",()=>{
welcome.hidden=true;surprise.hidden=false;
document.getElementById("again").focus({preventScroll:true});
});
document.getElementById("again").addEventListener("click",()=>{
surprise.hidden=true;welcome.hidden=false;
document.getElementById("open").focus({preventScroll:true});
});
</script>
</body>
</html>
