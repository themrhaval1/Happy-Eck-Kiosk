<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4fc">
<meta name="robots" content="noindex,nofollow">
<title>Lea is The Mentalist</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#241f33;background:#f7f4fc}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;overflow-x:hidden;position:relative;isolation:isolate;background:radial-gradient(ellipse at 15% 5%,#f9dbff 0%,transparent 42%),radial-gradient(ellipse at 88% 89%,#d9d5ff 0%,transparent 43%),#f7f4fc}
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat;opacity:.7}
body::before{background-image:radial-gradient(circle,#b897f3 0 2px,transparent 3px),radial-gradient(circle,#d1afff 0 2px,transparent 3px),radial-gradient(circle,#b897f3 0 1px,transparent 2px),radial-gradient(circle,#b897f3 0 2px,transparent 3px);background-size:8px 8px,7px 7px,6px 6px,8px 8px;background-position:15% 22%,80% 19%,10% 81%,90% 77%;animation:ambient 9s ease-in-out infinite alternate}
body::after{background-image:radial-gradient(circle,#cca4e8 0 2px,transparent 3px),radial-gradient(circle,#927ad5 0 1px,transparent 2px),radial-gradient(circle,#b897f3 0 2px,transparent 3px);background-size:8px 8px,6px 6px,8px 8px;background-position:32% 12%,74% 84%,91% 38%;animation:ambient 11s ease-in-out infinite alternate-reverse}
main{width:min(100%,390px);padding:clamp(24px,7vw,38px);background:linear-gradient(145deg,#fff 68%,#fbf7ff);border:1px solid #e9ddfa;border-radius:25px;box-shadow:0 22px 70px #7056b329,0 0 0 5px #ffffff55;text-align:center;position:relative;overflow:hidden}
main::before{content:"";position:absolute;left:-40%;top:0;width:180%;height:2px;background:linear-gradient(90deg,transparent,#b18bec,#fbcdfe,#b18bec,transparent);opacity:.8}
h1{font-size:clamp(34px,9vw,45px);letter-spacing:-.07em;line-height:1.1;margin:0 0 27px;background:linear-gradient(105deg,#241f33 12%,#7b4bc1 42%,#241f33 69%,#9961c7 100%);background-size:240% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:shimmer 6s ease-in-out infinite}
h2{font-size:24px;margin:0 0 15px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #5745a8;outline-offset:3px}
.action{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:linear-gradient(120deg,#7854c9,#9b6ce4,#7754ca);color:#fff;font-weight:800;padding:13px;box-shadow:0 8px 22px #7355c438;transition:transform .18s ease,box-shadow .18s ease}
.action:hover{transform:translateY(-2px);box-shadow:0 12px 25px #7355c449}
.action.secondary{background:#eee9f8;color:#6546aa;margin-top:12px}
[hidden]{display:none!important}
#game{margin-top:22px}
.score{font-size:13px;color:#736989;margin:0 0 12px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.tile{aspect-ratio: .82;border:1px solid #ded4ef;border-radius:13px;background:linear-gradient(150deg,#f5edff,#e7dcfb);color:#6a50ad;font-size:clamp(23px,7vw,34px);font-weight:800;min-width:0;padding:0;display:grid;place-items:center;box-shadow:0 4px 9px #4d307412;transform-style:preserve-3d;transition:box-shadow .2s ease,transform .2s ease}
.tile:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 8px 15px #76549a24}
.tile.open{background:linear-gradient(145deg,#fff,#f9edff);color:#302147;border-color:#c4b3e5;animation:turnCard .28s ease both}
.tile.matched{background:linear-gradient(145deg,#effef4,#d8f3e3);border-color:#9bcfb0;color:#2a6442;box-shadow:0 0 0 2px #b0e7c655,0 4px 15px #64c89224}
.tile:disabled{cursor:default;opacity:1}
.status{font-size:13px;color:#6e5b95;min-height:20px;margin:15px 0}
.back{margin-top:15px;background:none;border:0;color:#7459b7;font-size:14px;font-weight:700;padding:10px}
#start:not([hidden]),#content:not([hidden]){animation:appear .42s cubic-bezier(.18,.75,.35,1) both}
.spark{position:fixed;z-index:15;pointer-events:none;width:8px;height:8px;background:#a071e3;clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);filter:drop-shadow(0 0 3px #9b75e6);animation:sparkle .85s ease-out forwards}
.spark:nth-of-type(3n){background:#f3a8ed}.spark:nth-of-type(5n){background:#72bfe6}
@keyframes appear{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer{0%,100%{background-position:0% center}50%{background-position:100% center}}
@keyframes ambient{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes turnCard{0%{transform:rotateY(85deg);opacity:.5}100%{transform:rotateY(0);opacity:1}}
@keyframes sparkle{0%{opacity:1;transform:translate(0,0) scale(.2) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(180deg)}}
@media(max-width:350px){body{padding:10px}.board{gap:6px}main{padding:23px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="start">
<h1>Lea is The Mentalist</h1>
<button class="action" id="open" type="button">Öffnen</button>
</section>
<section id="content" hidden>
<h1>Lea is The Mentalist</h1>
<button class="action" id="play" type="button">Kartenspiel starten</button>
<div id="game" hidden>
<h2>Memory</h2>
<p class="score" id="score">0 von 6 Paaren</p>
<div class="board" id="board" aria-label="Memory-Kartenspiel"></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<button class="action secondary" id="restart" type="button">Neu mischen</button>
</div>
<button class="back" id="back" type="button">Zurück</button>
</section>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const faces=["A","B","C","D","E","F"];
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
function magicBurst(element,count=14){
if(reducedMotion.matches||!element)return;
const rect=element.getBoundingClientRect();
const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
for(let i=0;i<count;i++){
const star=document.createElement("span");
star.className="spark";star.setAttribute("aria-hidden","true");
star.style.left=cx+"px";star.style.top=cy+"px";
const angle=Math.PI*2*i/count+(Math.random()-.5)*.35;
const dist=28+Math.random()*75;
star.style.setProperty("--dx",Math.cos(angle)*dist+"px");
star.style.setProperty("--dy",Math.sin(angle)*dist+"px");
document.body.appendChild(star);
star.addEventListener("animationend",()=>star.remove(),{once:true});
}
}
let cards=[],first=null,second=null,matches=0,busy=false,pending=null;
function stop(){clearTimeout(pending);pending=null;busy=false}
function startGame(){
stop();first=null;second=null;matches=0;
cards=[...faces,...faces].map((face,i)=>({face,id:i,open:false,matched:false}));
for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
$("game").hidden=false;$("play").hidden=true;
$("score").textContent="0 von 6 Paaren";$("status").textContent="";
render();
}
function render(){
const board=$("board");board.replaceChildren();
cards.forEach((c,i)=>{
const b=document.createElement("button");b.type="button";
b.className="tile"+(c.matched?" matched":c.open?" open":"");
b.textContent=c.open||c.matched?c.face:"?";
b.setAttribute("aria-label",c.open||c.matched?"Karte "+(i+1)+": "+c.face:"Karte "+(i+1)+", verdeckt");
b.disabled=c.open||c.matched||busy;
b.addEventListener("click",()=>flip(i));
board.appendChild(b);
});
}
function flip(i){
if(busy||cards[i].open||cards[i].matched)return;
cards[i].open=true;
if(first===null){first=i;render();return}
second=i;busy=true;render();
if(cards[first].face===cards[second].face){
cards[first].matched=cards[second].matched=true;
matches++;$("score").textContent=matches+" von 6 Paaren";
$("status").textContent=matches===6?"Gewonnen!":"Paar gefunden.";
const matchedIndices=[first,second];
first=null;second=null;busy=false;render();
for(const idx of matchedIndices)magicBurst($("board").children[idx],7);
if(matches===6)magicBurst($("board"),22);
}else{
$("status").textContent="Noch mal versuchen.";
pending=setTimeout(()=>{
cards[first].open=false;cards[second].open=false;
first=null;second=null;busy=false;pending=null;render();
},850);
}
}
$("open").addEventListener("click",()=>{$("start").hidden=true;$("content").hidden=false;magicBurst($("content").querySelector("h1"),22)});
$("play").addEventListener("click",()=>{startGame();magicBurst($("board"),14)});
$("restart").addEventListener("click",()=>{startGame();magicBurst($("board"),10)});
$("back").addEventListener("click",()=>{
stop();$("game").hidden=true;$("play").hidden=false;
$("content").hidden=true;$("start").hidden=false;
});
})();
</script>
</body>
</html>
